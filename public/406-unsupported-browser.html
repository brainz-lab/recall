<!doctype html>
<html lang="en">
  <head>
    <title>Browser not supported - Recall</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }

      :root {
        --cream-50: #FDFCFA;
        --cream-100: #FAF8F5;
        --cream-200: #F5F3EF;
        --cream-300: #EBE8E3;
        --ink-900: #1A1A1A;
        --ink-600: #525252;
        --ink-400: #8B8780;
        --coral: #D97757;
        --orange-500: #F97316;
        --info: #3B82F6;
        --info-light: #DBEAFE;
      }

      body {
        background: linear-gradient(135deg, var(--cream-50) 0%, var(--cream-100) 100%);
        color: var(--ink-900);
        display: grid;
        font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
        font-size: 16px;
        -webkit-font-smoothing: antialiased;
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1.5;
        min-height: 100dvh;
        place-items: center;
        text-rendering: optimizeLegibility;
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
        padding: 2rem;
        text-align: center;
        max-width: 28rem;
      }

      .logo {
        width: 3.5rem;
        height: 3.5rem;
        border-radius: 1rem;
        background: linear-gradient(135deg, var(--coral) 0%, var(--orange-500) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 12px -2px rgba(217, 119, 87, 0.35);
      }

      .logo svg {
        width: 2rem;
        height: 2rem;
        fill: white;
      }

      .error-code {
        font-size: 5rem;
        font-weight: 700;
        letter-spacing: -0.04em;
        color: var(--info);
        line-height: 1;
      }

      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        color: var(--ink-900);
        margin-top: -0.5rem;
      }

      p {
        font-size: 0.9375rem;
        color: var(--ink-600);
        line-height: 1.6;
      }

      .info-hint {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        font-size: 0.8125rem;
        background: var(--info-light);
        color: #1D4ED8;
        border-radius: 0.5rem;
        border: 1px solid rgba(59, 130, 246, 0.3);
      }

      .browsers {
        display: flex;
        gap: 1rem;
        margin-top: 0.5rem;
      }

      .browser-link {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.5rem;
        padding: 1rem 1.25rem;
        font-size: 0.75rem;
        font-weight: 500;
        color: var(--ink-600);
        background: white;
        border: 1px solid var(--cream-300);
        border-radius: 0.75rem;
        text-decoration: none;
        transition: all 0.15s ease;
      }

      .browser-link:hover {
        border-color: var(--coral);
        box-shadow: 0 4px 12px -4px rgba(217, 119, 87, 0.2);
        transform: translateY(-2px);
      }

      .browser-link svg {
        width: 2rem;
        height: 2rem;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/></svg>
      </div>
      <div class="error-code">406</div>
      <h1>Browser not supported</h1>
      <p>Your browser doesn't support the features needed to run Recall. Please upgrade to a modern browser.</p>
      <div class="info-hint">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 16v-4M12 8h.01"/>
        </svg>
        Try one of these browsers
      </div>
      <div class="browsers">
        <a href="https://www.google.com/chrome/" class="browser-link" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="#4285F4" stroke-width="2"/>
            <circle cx="12" cy="12" r="4" fill="#4285F4"/>
          </svg>
          Chrome
        </a>
        <a href="https://www.mozilla.org/firefox/" class="browser-link" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="#FF7139" stroke-width="2"/>
            <circle cx="12" cy="12" r="4" fill="#FF7139"/>
          </svg>
          Firefox
        </a>
        <a href="https://www.apple.com/safari/" class="browser-link" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="10" stroke="#0FB5EE" stroke-width="2"/>
            <circle cx="12" cy="12" r="4" fill="#0FB5EE"/>
          </svg>
          Safari
        </a>
      </div>
    </main>
  </body>
</html>
